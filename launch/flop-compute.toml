# FLOP-COMPUTE launch config: a devnet DEMO market on FLOP Network's compute
# price (docs/flop-compute/INDEX.md). Devnet and local only; never mainnet,
# never real money. Separate from SOL-PERP and changes nothing about it.
# The mark is USD per 1M tokens of Qwen3.8-27B, e6: real FLOP settlements
# (FLOP per G_n) x 52e6 G_n per 1M tokens x a FLOP/USD STAND-IN (no FLOP/USD
# market until mainnet; see flop_usd_standin). PnL is paid in the test mint.
# Same layout as launch/sol-perp.toml; only the differences are commented.

# Must equal scripts/pins.env, the single source of truth that
# scripts/fetch_upstream.sh and the crates' build.rs read. launch_market.sh
# refuses to run when they differ.
[pins]
wrapper_sha = "555a9a10a4fff83a3ecd42eed71f8d585219c425"
engine_rev = "b77519352e0d42ea2e4ce1d8806a7078cb42eed4"

# Steps, roles and keys work as in sol-perp.toml (docs/LAUNCH.md).
[cluster.local]
rpc = "http://127.0.0.1:8799"
program_id = ""
collateral_mint = "create"
# Real FLOP settlements even on a local validator (reads only).
price_source = "flop"
matcher_ctxs = []
matcher_max_ref_age_slots = 5

[cluster.devnet]
rpc = "https://api.devnet.solana.com"
# Our devnet wrapper.
program_id = "GaXu3DXKYcMs8WmZsgfWcHXQSDva2qe7Aguvn3YHKSHS"
collateral_mint = "create"
price_source = "flop"
# No on-chain matcher: the bots' off-chain matcher co-signs TradeNoCpi between
# the run's LP and test trader.
matcher_ctxs = []
matcher_max_ref_age_slots = 80

[oracle]
# FLOP index (pusher/flop.rs): G_n-weighted median of escrow / aggregateGn over
# spot, non-self-trade settlements in the last flop_window_s; stale (no push)
# with fewer than flop_min_prints or flop_min_miners distinct miners in the
# window, or when the newest is older than flop_max_age_s.
# FLOP devnet ran ~35 settlements an hour on 2026-11-10.
flop_mcp_url = "https://mcp.flop.network/mcp"
flop_window_s = 21600
flop_min_prints = 20
flop_max_age_s = 1800
flop_refresh_s = 60
flop_min_miners = 3
# Qwen3.8-27B: 52 GF/token = 52e6 G_n per 1M tokens.
flop_gn_per_mtok = 52000000
# FLOP/USD STAND-IN, devnet only (no FLOP/USD market until mainnet; then a
# live feed replaces it). Derived, not typed: the rate at which the anchor
# FLOP per G_n prices 1M tokens at OpenRouter's qwen/qwen3.8-27b (DeepInfra
# BF16, matching FLOP's weights) blended input:output price. Blend 15:1 is
# OpenRouter's measured mix (State of AI, arXiv 2601.10088: ~6,000 in / 400
# out). (15 x 0.15 + 1.875) / 16 = $0.2578125 per 1M -> FLOP/USD 0.0000016527.
# Owner decisions 2026-11-11; the blend is a convention and may change.
flop_ref_usd_in = 0.15
flop_ref_usd_out = 1.875
flop_blend_in_out = 15
flop_anchor_flop_per_gn = 0.003
# Mark = live OpenRouter USD leg: each up endpoint's 15:1 blend, combined by
# 1/price^2 weights as OpenRouter's default routing spreads load (decision,
# 2026-11-11), over bf16, else fp16, endpoints; fewer than 2 falls back to all. flop_standin keeps the old
# FLOP side x stand-in mark for when a live FLOP/USD exists.
flop_mark_source = "openrouter"
or_url = "https://openrouter.ai/api/v1/models/qwen/qwen3.8-27b/endpoints"
or_quantizations = ["bf16", "fp16"]
or_min_endpoints = 2
or_refresh_s = 300
or_max_age_s = 1800                # no good fetch in 30 min: stale, hold
or_weighting = "inverse_square"     # or "median"
or_min_frac_of_median = 0.5        # listings under half the median count as half the median (clamp)
or_clamp_min_endpoints = 3         # ...only in a set of 3+ up endpoints; 2 points can't name an outlier
or_hold_missing_s = 0              # a down or unlisted endpoint counts at its last up price this long; 0 = off (length not chosen yet)
or_hold_confirm_s = 3600           # ...only a price it has been seen up at for this long (a price flashed for one fetch is never held)
# Manipulation limits on the FLOP side: one buyer or miner is scaled down to
# 45% of the window's weight (strictly under half, so it can't tie everyone
# else and set a low median); fewer than 3 distinct buyers is stale.
flop_max_agent_share = 0.45
flop_max_miner_share = 0.45
flop_min_agents = 3
# Status polling interval for mark pushes and accrual transactions.
confirm_poll_ms = 500
# Unused by price_source = "flop"; the config loader requires them.
pyth_feed_id = "0xef0d8b6fda2ceba41da15d4095d1da392a0d2f8ed0c6c7bc0f4cfac8c280b56d"
pyth_price_account = "7UVimffxr9ow1uXYxsr4LHAcV58mLzhmwaeKvJ1pjLiE"
pyth_max_age_s = 120
pyth_max_conf_bps = 100
# Settlements land minutes apart; lag here is the newest print's age.
lag_target_ms = 1800000
# Main bots tick; the pusher has its own RPC and thread.
push_interval_ms = 3000
push_heartbeat_slots = 25
push_poll_ms = 400
accrual_lag_slots = 32
accrual_max_cranks_per_tx = 10
push_min_move_bps = 1
priority_fee_micro_lamports = 10000
# Local landed PushAuthMark: 6,596 CU including budget instructions; ~2x.
push_cu_limit = 14000
# Source publish age, not landing age. Slow sources (e.g. devnet Pyth
# fallback, ~13 s) refuse opens unless this is raised for that run.
open_max_mark_age_ms = 1800000   # = or_max_age_s: the MM stops when the source does

# InitMarket. Values and reasoning: docs/OPERATOR_PLAYBOOK.md section 2.
[market]
max_portfolio_assets = 1
initial_price = 311207           # ~$0.31 per 1M tokens (OpenRouter bf16, 1/price² weighted, 2026-11-11); the live mark sets it
h_min = 0
h_max = 150
min_nonzero_mm_req = 1000
min_nonzero_im_req = 2000
maintenance_margin_bps = 2500
initial_margin_bps = 5000        # 2x: thin, gappy index
max_trading_fee_bps = 100
# 15 bps (decision, 2026-10-30). 5 bps loses to latency arbitrage at every
# reachable lag (research/replay/REPORT.md). Post-stall-fix replay
# (REPORT-post-fix.md): 12 bps nets +4.8 bps, break-even ~$211k/day, and
# turns negative near 1.4 s lag; 15 bps nets +10.4, break-even ~$98k/day.
trade_fee_base_bps = 15
liquidation_fee_bps = 50
liquidation_fee_cap = 10000000000
min_liquidation_abs = 0
# The median can jump between FLOP's few price levels (~3%); at 20 bps a slot
# the mark follows in ~15 slots.
max_price_move_bps_per_slot = 20
# The engine caps accrual at 32 slots per crank anyway.
max_accrual_dt_slots = 64
max_abs_funding_e9_per_slot = 10000
min_funding_lifetime_slots = 64
max_account_b_settlement_chunks = 4
max_bankrupt_close_chunks = 4
max_bankrupt_close_lifetime_slots = 1500
public_b_chunk_atoms = "max"     # MAX_VAULT_TVL
# 0 keeps the market Meta reward- and donation-compatible: percolator-meta's
# reward epochs reject a nonzero maintenance fee (residual-distributor
# lib.rs:2100-2113). The permissionless asset-init fee stays 0 (InitMarket
# default, never raised here): listing closed, as donation requires.
maintenance_fee_per_slot = 0

# ConfigurePermissionlessResolve. The index can go stale for hours, so a
# stale resolve needs ~24 h without a mark (SOL-PERP: ~1 h).
[resolve]
stale_slots = 216000
force_close_delay_slots = 20

# Off-chain matcher: LP and trader co-sign TradeNoCpi at mark +- spread.
# Pushes also refresh any configured on-chain TradeCpi matcher contexts.
[matcher]
program_id = "8era4GFKLUu24TLr1H2Gjqt5csiYj4jhPwoxCXfEDvKE"
# Market maker (devnet demo): small size, small inventory, quotes pulled
# (no opens or closes) when the mark is stale, a kill-switch file, a JSON line
# per fill. At this engine pin a co-signed fill books at the oracle mark; the
# quote price only sizes the fee, so a +-1% quote can't be expressed: spread_bps
# stays at the 10 bps the wrapper has accepted on devnet.
max_fill_notional_usd = 100
max_lp_inventory_usd = 500
size_q = 100000000                # 100 x 1M tokens (~31 test dollars)
spread_bps = 10
pull_when_stale = true
kill_file = "/run-dir/KILL"       # touch it to stop all trades; rm to resume
log_fills = true
fee_bps = 15                     # >= trade_fee_base_bps (the wrapper refuses less)

[amounts]
lp_deposit = 30000000000         # $30k
trader_deposit = 30000000000     # test trader (local, devnet only)
insurance_seed = 10000000        # $10
insurance_topup = 10000000       # bots: every insurance_every ticks
insurance_every = 30
backing_per_domain = 10000000000 # $10k on domains 0 (long) and 1 (short)
backing_tenor_slots = 9000       # ~1 h
# Test mint only: minted to the authority for backing and insurance.
authority_test_mint = 10000000000000

[monitor]
listen = "127.0.0.1:9185"     # SOL-PERP uses 9184
