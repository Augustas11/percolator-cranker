[package]
name = "drip"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "drip"

[lib]
name = "drip"
path = "src/lib.rs"

[[bin]]
name = "drip"
path = "src/main.rs"

[dependencies]
solana-sdk = "1.18"
solana-client = "1.18"
solana-program = "1.18"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "2.0", features = ["no-entrypoint"] }
# Match the wrapper's engine pin exactly — otherwise two `percolator` crates
# get linked into the graph with mismatched types. Our wrapper fork
# (scripts/pins.env) pins engine master `b22bef7d`.
percolator = { git = "https://github.com/aeyakovenko/percolator", rev = "b22bef7d6122fd7d82680ce9859e8b77fd8ef656" }
percolator-prog = { path = "../repo-prog" }
solana-transaction-status = "1.18"
solana-account-decoder = "1.18"
bytemuck = { version = "1.14", features = ["derive", "min_const_generics"] }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
litesvm = "0.1"
