[package]
name = "drip"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "drip"

[lib]
name = "drip"
path = "src/lib.rs"

[[bin]]
name = "drip"
path = "src/main.rs"

[dependencies]
solana-sdk = "1.18"
solana-client = "1.18"
solana-program = "1.18"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "2.0", features = ["no-entrypoint"] }
# Match the wrapper's engine pin exactly — otherwise two `percolator` crates
# get linked into the graph with mismatched types. Our wrapper fork
# (scripts/pins.env) pins our engine fork `b7751935` (master b22bef7d + #172 fix).
percolator = { git = "https://github.com/Augustas11/percolator", rev = "b77519352e0d42ea2e4ce1d8806a7078cb42eed4" }
percolator-prog = { path = "../repo-prog" }
solana-transaction-status = "1.18"
solana-account-decoder = "1.18"
bytemuck = { version = "1.14", features = ["derive", "min_const_generics"] }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
litesvm = "0.1"
