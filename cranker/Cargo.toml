[package]
name = "percolator-cranker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "percolator_cranker"
path = "src/lib.rs"

[[bin]]
name = "cranker"
path = "src/main.rs"

[dependencies]
solana-sdk = "1.18"
solana-client = "1.18"
solana-program = "1.18"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "2.0", features = ["no-entrypoint"] }
# Match the wrapper's engine pin exactly — otherwise two `percolator` crates
# get linked into the graph with mismatched types. Wrapper `d5e2ec6f` (#135)
# pins engine `495a5590` (parent of master-tip merge #195 / `8eb7142a`).
percolator = { git = "https://github.com/aeyakovenko/percolator", rev = "495a5590c97055bd71c6f94d849ff0298f243145" }
percolator-prog = { path = "../repo-prog" }
solana-transaction-status = "1.18"
solana-account-decoder = "1.18"
bytemuck = { version = "1.14", features = ["derive", "min_const_generics"] }
anyhow = "1"
