[package]
name = "indexer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Augustas11/drip-markets"
publish = false
default-run = "indexer"

[dependencies]
drip = { path = "../cranker" }
percolator = { git = "https://github.com/Augustas11/percolator", rev = "ba32c912d82bcca7b548f86e145e19c19371ec66" }
percolator-prog = { path = "../repo-prog" }
solana-sdk = "1.18"
solana-client = "1.18"
bytemuck = { version = "1.14", features = ["derive", "min_const_generics"] }
anyhow = "1"
serde_json = "1"
base64 = "0.21"
solana-transaction-status = "1.18"
serde = { version = "1", features = ["derive"] }
bs58 = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
tiny_http = "0.12"
