# Prometheus for the Day-0 monitor; rules are monitor/alerts.yml.
# docker compose targets; on a systemd host use 127.0.0.1:9184 and 127.0.0.1:9093.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]
scrape_configs:
  - job_name: percolator-monitor   # MonitorDown matches this job name
    static_configs: [{ targets: ["monitor:9184"] }]
