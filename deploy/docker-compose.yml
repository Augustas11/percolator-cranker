# Day-0 hosting on one server: the bots (pusher, matcher, backing, insurance,
# keeper), the monitor, Prometheus with monitor/alerts.yml, Alertmanager to
# Telegram. Reference / dry-run only; not a paid live service; M3 NO-GO.
# Nothing here creates accounts or deploys programs. docs/LAUNCH.md, "Hosting".
#
#   cp deploy/launch.env.example deploy/.env   # fill it in; never commit it
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# LAUNCH_RUN_DIR is the launch's run dir (state.json + keys/, 0600), made by
# scripts/launch_market.sh; the bots read it and append bots.log there.
services:
  bots:
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: percolator-launch:local
    restart: on-failure
    # Run as the owner of the run dir, so its 0600 keys stay 0600 and readable.
    user: "${LAUNCH_UID:?set LAUNCH_UID (id -u of the run dir owner)}:${LAUNCH_GID:?set LAUNCH_GID}"
    environment:
      LAUNCH_CLUSTER: ${LAUNCH_CLUSTER}
      LAUNCH_RPC_URL: ${LAUNCH_RPC_URL}
      PERCOLATOR_PROGRAM_ID: ${PERCOLATOR_PROGRAM_ID}
      # Mainnet bots need the explicit opt-in (default off); genesis and the
      # on-chain role table are still checked before anything runs.
      LAUNCH_MAINNET_I_UNDERSTAND: ${LAUNCH_MAINNET_I_UNDERSTAND:-0}
    volumes: ["${LAUNCH_RUN_DIR:?set LAUNCH_RUN_DIR}:/run-dir"]
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec staging bots /etc/percolator/sol-perp.toml "$$LAUNCH_CLUSTER" /run-dir >> /run-dir/bots.log 2>&1']

  monitor:
    image: percolator-launch:local
    depends_on: [bots]
    restart: on-failure   # exits until bots.log names the market
    user: "${LAUNCH_UID:?set LAUNCH_UID}:${LAUNCH_GID:?set LAUNCH_GID}"
    environment: [LAUNCH_RPC_URL, PERCOLATOR_PROGRAM_ID]
    volumes: ["${LAUNCH_RUN_DIR:?set LAUNCH_RUN_DIR}:/run-dir:ro"]
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec monitor --rpc "$$LAUNCH_RPC_URL" --keeper-log /run-dir/bots.log --listen 0.0.0.0:9184']
    ports: ["127.0.0.1:9184:9184"]

  # Read-only indexer for the frontend panels, plus a small public proxy in
  # its network namespace (the indexer binds loopback only). INDEXER_DATA_DIR
  # holds the SQLite database.
  indexer:
    build: { context: .., dockerfile: deploy/Dockerfile.indexer }
    image: percolator-indexer:local
    restart: unless-stopped
    user: "${LAUNCH_UID:?set LAUNCH_UID}:${LAUNCH_GID:?set LAUNCH_GID}"
    environment:
      INDEXER_RPC_URL: ${LAUNCH_RPC_URL}
      INDEXER_PROGRAM_ID: ${PERCOLATOR_PROGRAM_ID}
      INDEXER_MARKET: ${INDEXER_MARKET:?set INDEXER_MARKET}
      INDEXER_DB: /data/indexer.sqlite
      INDEXER_START_SLOT: ${INDEXER_START_SLOT:-}
    volumes: ["${INDEXER_DATA_DIR:?set INDEXER_DATA_DIR}:/data"]
    ports:
      - "${INDEXER_PUBLIC_PORT:-127.0.0.1:8091}:8091"
      - "${FAUCET_PUBLIC_PORT:-127.0.0.1:8092}:8092"
    # Shared host: keep this public workload small and bounded.
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # Devnet test-USDC faucet; claimants create their own token accounts.
  # FAUCET_PAYER_KEYPAIR holds the mint authority (read-only mount).
  # FAUCET_DATA_DIR persists rolling wallet limits and the UTC daily cap.
  # Loopback in the indexer's namespace; indexer-proxy fronts it on 8092.
  faucet:
    build: { context: .., dockerfile: deploy/Dockerfile.faucet }
    image: percolator-faucet:local
    restart: unless-stopped
    user: "${LAUNCH_UID:?set LAUNCH_UID}:${LAUNCH_GID:?set LAUNCH_GID}"
    environment:
      FAUCET_RPC_URL: ${LAUNCH_RPC_URL}
      FAUCET_KEYPAIR: /keys/payer.json
      FAUCET_STATE: /data/faucet-state.json
      FAUCET_BIND: 127.0.0.1:8093
    volumes:
      - "${FAUCET_PAYER_KEYPAIR:?set FAUCET_PAYER_KEYPAIR}:/keys/payer.json:ro"
      - "${FAUCET_DATA_DIR:?set FAUCET_DATA_DIR}:/data"
    depends_on: [indexer]
    network_mode: "service:indexer"
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # House starter agents (agents/): trade the devnet market through the MCP on
  # the public RPC. One wallet per agent; AGENTS_KEYS_DIR holds
  # trend.json, meanrev.json, breakout.json (0600, owned by LAUNCH_UID).
  agents:
    build: { context: ../agents }
    image: drip-agents:local
    restart: unless-stopped
    user: "${LAUNCH_UID:?set LAUNCH_UID}:${LAUNCH_GID:?set LAUNCH_GID}"
    command: ["trend,meanrev,breakout"]
    environment:
      DRIP_KEYPAIR_TREND: /keys/trend.json
      DRIP_KEYPAIR_MEANREV: /keys/meanrev.json
      DRIP_KEYPAIR_BREAKOUT: /keys/breakout.json
    volumes: ["${AGENTS_KEYS_DIR:-/opt/drip/agents/keys}:/keys:ro"]
    profiles: [agents]
    cpus: 0.25
    mem_limit: 384m
    pids_limit: 128
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # Compute price feed for the site's /compute page (docs/flop-compute/FEED.md):
  # reads the FLOP market's push log, the OpenRouter recorder and the wide
  # collector, writes latest.json, history.json and market.json to
  # COMPUTE_FEED_DIR, which indexer-proxy serves at /compute-feed/.
  # Opt-in: --profile compute-feed.
  compute-feed:
    build: { context: .., dockerfile: deploy/Dockerfile.flop-feed }
    image: flop-feed:local
    restart: unless-stopped
    user: "${LAUNCH_UID:?set LAUNCH_UID}:${LAUNCH_GID:?set LAUNCH_GID}"
    command: ["/flop-run/bots.log", "/or-prices", "/feed", "--oracle", "${FLOP_ORACLE_PUBKEY:-}", "--wide", "/or-prices-wide", "--loop", "60"]
    volumes:
      - "${FLOP_RUN_DIR:-/opt/drip/flop-devnet}/bots.log:/flop-run/bots.log:ro"
      - "${OR_PRICES_DIR:-/opt/drip/or-prices}:/or-prices:ro"
      - "${OR_PRICES_WIDE_DIR:-/opt/drip/or-prices-wide}:/or-prices-wide:ro"
      - "${COMPUTE_FEED_DIR:-/opt/drip/compute-feed}:/feed"
    profiles: [compute-feed]
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 32
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  indexer-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [indexer, faucet]
    network_mode: "service:indexer"
    volumes:
      - ./indexer-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - "${COMPUTE_FEED_DIR:-/opt/drip/compute-feed}:/srv/compute-feed:ro"
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitor/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    environment: [TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID]
    volumes: ["./alertmanager.yml:/etc/alertmanager/alertmanager.yml.tmpl:ro"]
    # Alertmanager does not expand env vars: fill the chat id in, and hand
    # the token over as a file.
    entrypoint: ["/bin/sh", "-c"]
    command: ['sed "s/TELEGRAM_CHAT_ID/$$TELEGRAM_CHAT_ID/" /etc/alertmanager/alertmanager.yml.tmpl > /tmp/am.yml && printf %s "$$TELEGRAM_BOT_TOKEN" > /tmp/tg_token && exec /bin/alertmanager --config.file=/tmp/am.yml --storage.path=/alertmanager']
