# Public front for the loopback-only indexer (indexer/README.md asks for a
# reverse proxy with body limits and timeouts). Shares the indexer's network
# namespace, so 127.0.0.1:8090 is the indexer. GET only, small and rate limited.
limit_req_zone $binary_remote_addr zone=idx:1m rate=10r/s;

server {
    listen 8091;
    server_tokens off;
    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 10s;

    location / {
        limit_except GET { deny all; }
        limit_req zone=idx burst=20 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }
}
