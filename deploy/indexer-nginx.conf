# Public front for the loopback-only indexer (indexer/README.md asks for a
# reverse proxy with body limits and timeouts). Shares the indexer's network
# namespace, so 127.0.0.1:8090 is the indexer. GET only, small, cached and
# capped in aggregate: most traffic arrives from Vercel's few egress IPs, so a
# per-IP limit alone would throttle every visitor together.
proxy_cache_path /var/cache/nginx/idx keys_zone=idx_cache:1m max_size=10m inactive=1m;
limit_req_zone $server_name zone=idx_all:1m rate=50r/s;
limit_req_zone $binary_remote_addr zone=idx_ip:1m rate=20r/s;
limit_conn_zone $server_name zone=idx_conn:1m;

server {
    listen 8091;
    server_tokens off;
    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 10s;
    limit_conn idx_conn 64;

    location / {
        limit_except GET { deny all; }
        limit_req zone=idx_all burst=100 nodelay;
        limit_req zone=idx_ip burst=40 nodelay;
        proxy_cache idx_cache;
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_pass http://127.0.0.1:8090;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }
}
