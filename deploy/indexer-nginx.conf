# Public front for the loopback-only indexer (indexer/README.md asks for a
# reverse proxy with body limits and timeouts). Shares the indexer's network
# namespace, so 127.0.0.1:8090 is the indexer. GET only, small, cached and
# capped in aggregate only: most traffic arrives from Vercel's few egress IPs,
# so a per-IP limit would throttle every visitor together.
proxy_cache_path /var/cache/nginx/idx keys_zone=idx_cache:1m max_size=10m inactive=1m;
limit_req_zone $server_name zone=idx_all:1m rate=50r/s;
limit_conn_zone $server_name zone=idx_conn:1m;
limit_req_zone $server_name zone=faucet_all:1m rate=2r/s;

# Server names give the limit zones a non-empty key.
server {
    listen 8091;
    server_name indexer;
    server_tokens off;
    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 10s;
    limit_conn idx_conn 64;

    location / {
        limit_except GET { deny all; }
        limit_req zone=idx_all burst=100 nodelay;
        proxy_cache idx_cache;
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_pass http://127.0.0.1:8090;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # Compute price feed (docs/flop-compute/FEED.md): static JSON written by
    # the compute-feed service, mounted read-only.
    location /compute-feed/ {
        limit_except GET { deny all; }
        limit_req zone=idx_all burst=100 nodelay;
        alias /srv/compute-feed/;
        add_header Cache-Control "no-store";
        # Not public: the index state, temp files and the lock (dotfiles).
        location ~ ^/compute-feed/(\.|index-state\.json$) {
            return 404;
        }
    }
}

# Devnet test-USDC faucet (faucet/README.md) on 127.0.0.1:8093: GET/POST,
# 1 KB bodies, aggregate rate cap; the faucet enforces wallet and daily limits.
server {
    listen 8092;
    server_name faucet;
    server_tokens off;
    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 10s;
    limit_conn idx_conn 16;

    location / {
        limit_except GET POST { deny all; }
        limit_req zone=faucet_all burst=10 nodelay;
        proxy_pass http://127.0.0.1:8093;
        proxy_connect_timeout 2s;
        proxy_read_timeout 75s;
    }
}
