[package]
name = "drip-matcher-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Augustas11/drip-markets"
publish = false

[workspace]

[dependencies]
solana-sdk = "1.18"
solana-client = "1.18"
percolator-prog = { path = "../../repo-prog", features = ["no-entrypoint"], default-features = false }
percolator = { git = "https://github.com/Augustas11/percolator", rev = "ba32c912d82bcca7b548f86e145e19c19371ec66" }
spl-token = { version = "4.0", features = ["no-entrypoint"] }
anyhow = "1"

[dev-dependencies]
litesvm = "0.1"
