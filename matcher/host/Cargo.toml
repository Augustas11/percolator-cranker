[package]
name = "drip-matcher-host"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
solana-sdk = "1.18"
solana-client = "1.18"
percolator-prog = { path = "../../repo-prog", features = ["no-entrypoint"], default-features = false }
percolator = { git = "https://github.com/aeyakovenko/percolator", rev = "b22bef7d6122fd7d82680ce9859e8b77fd8ef656" }
spl-token = { version = "4.0", features = ["no-entrypoint"] }
anyhow = "1"

[dev-dependencies]
litesvm = "0.1"
