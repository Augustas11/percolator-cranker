[package]
name = "monitor"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "monitor"

[dependencies]
drip = { path = "../cranker" }
percolator = { git = "https://github.com/Augustas11/percolator", rev = "ba32c912d82bcca7b548f86e145e19c19371ec66" }
percolator-prog = { path = "../repo-prog" }
solana-sdk = "1.18"
solana-client = "1.18"
solana-account-decoder = "1.18"
bytemuck = { version = "1.14", features = ["derive", "min_const_generics"] }
anyhow = "1"
serde_json = "1"
bincode = "1.3"
base64 = "0.21"
