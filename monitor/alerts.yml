groups:
  - name: percolator-monitor
    rules:
      - record: percolator:unowned_collateral_drift_atoms_per_hour
        expr: delta(percolator_unowned_collateral_atoms[1h])
      - alert: KeeperAccountUnrefreshable
        # Aggregate away strike/error: they change on re-quarantine and would reset `for`.
        expr: max by (market, account) (percolator_keeper_account_quarantined_slots) > 1500
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Keeper account unrefreshable for over 1500 slots'
      # Tune the drift threshold per market.
      - alert: UnownedCollateralDrift
        expr: abs(percolator:unowned_collateral_drift_atoms_per_hour) > 1000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Unowned collateral changed by over 1000 atoms/hour'
      - alert: BackingBucketExpiringWithLiens
        expr: percolator_backing_buckets_expiring_with_liens > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Fresh backing bucket with liens is near or past expiry'
      - alert: KeeperNoSuccessfulCrank
        # Live only: in Resolved mode a healthy keeper may land nothing (owner window,
        # EngineNonProgress). KeeperLogStale still catches a stopped keeper there.
        expr: percolator_keeper_slots_since_last_success > 750 and on(market) percolator_market_mode{mode="live"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'No landed keeper crank for over 750 slots'
      - alert: KeeperLogStale
        expr: percolator_keeper_log_age_seconds > 120 or percolator_keeper_log_ok == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Keeper log is unreadable or older than 120 seconds'
      # Money case (research/replay/REPORT.md): 12 bps holds only with the
      # mark within ~400 ms of the market. Lag = source price time to push landed.
      - alert: PusherMarkLagHigh
        expr: percolator_keeper_mark_lag_ms > 400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Pushed mark lags the source price by over 400 ms'
      # The lag gauge keeps its last value when pushes stop; the age does not.
      - alert: PusherMarkStale
        expr: percolator_keeper_mark_push_age_seconds > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'No price push has landed for over two minutes'
      - alert: MonitorChainReadFailing
        expr: percolator_monitor_chain_read_ok == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Monitor chain reads have failed for five minutes'
      # The monitor itself: a silent monitor must page like a finding.
      - alert: MonitorDown
        expr: up{job="percolator-monitor"} == 0 or absent(percolator_monitor_chain_read_ok)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Monitor scrape failing or monitor metrics absent'
      # A hung poll loop would keep serving its last snapshot.
      - alert: MonitorSnapshotStale
        expr: time() - percolator_monitor_snapshot_unix_seconds > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Monitor snapshot older than 60 seconds'
