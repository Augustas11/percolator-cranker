[package]
name = "engine-fuzz"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shadow-ledger money fuzzer for the Percolator v16 engine"

[dependencies]
# Production pin: same rev as repo-prog/Cargo.toml. run.sh master patches this to a local checkout.
percolator = { git = "https://github.com/Augustas11/percolator", rev = "ba32c912d82bcca7b548f86e145e19c19371ec66" }

[dev-dependencies]
proptest = "1.4"

# Same release flags the engine uses for its own tests.
[profile.release]
opt-level = 3
overflow-checks = true
