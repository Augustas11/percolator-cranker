[package]
name = "staging"
version = "0.1.0"
edition = "2021"
publish = false

# Private: the local staging market (docs/STAGING.md). Not exported.
[dependencies]
drip = { path = "../cranker" }
percolator-prog = { path = "../repo-prog" }
# Same engine rev as cranker/Cargo.toml (one `percolator` crate in the graph).
percolator = { git = "https://github.com/aeyakovenko/percolator", rev = "4db11a8cb0053815e23a35d3a7d3edc265d8d866" }
solana-sdk = "1.18"
solana-client = "1.18"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "2.0", features = ["no-entrypoint"] }
anyhow = "1"
# Day-0 launch (launch.rs): config, state file, unsigned multisig txs.
# All already in the graph through solana-client.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.5"
bincode = "1.3"
