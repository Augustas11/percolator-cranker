[package]
name = "percolator-m1-bringup"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
default-run = "m1_bringup"

[[bin]]
name = "m1_bringup"
path = "src/main.rs"

[dependencies]
solana-sdk = "1.18"
solana-client = "1.18"
solana-program = "1.18"
solana-transaction-status = "1.18"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "2.0", features = ["no-entrypoint"] }
# Must equal our wrapper fork's engine pin (scripts/pins.env).
percolator = { git = "https://github.com/Augustas11/percolator", rev = "ba32c912d82bcca7b548f86e145e19c19371ec66" }
# Reuse the wrapper's instruction encoder + state helpers.
percolator-prog = { path = "../repo-prog" }
anyhow = "1"
