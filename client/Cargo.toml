[package]
name = "percolator-m1-bringup"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "m1_bringup"
path = "src/main.rs"

[dependencies]
solana-sdk = "1.18"
solana-client = "1.18"
solana-program = "1.18"
solana-transaction-status = "1.18"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "2.0", features = ["no-entrypoint"] }
# Wrapper `d5e2ec6f` (#135) pins engine `495a5590` (one behind master tip
# `8eb7142a` / merge #195). Deliberate wrapper-pin, not a master-tip override.
percolator = { git = "https://github.com/aeyakovenko/percolator", rev = "495a5590c97055bd71c6f94d849ff0298f243145" }
# Reuse the wrapper's instruction encoder + state helpers.
percolator-prog = { path = "../repo-prog" }
anyhow = "1"
